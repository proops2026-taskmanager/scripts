name: App CI — PR

# Runs on every pull request regardless of target branch.
# Purpose: fast feedback before merge — run tests, no image push, no deploy.
# Blocked by: nothing. This job gates the merge button.

on:
  pull_request:
    paths-ignore:
      - 'ci/**'
      - '*.md'

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: chau11ece/proops2026-cicd-platform/.github/workflows/reusable-app-ci.yml@v4
    with:
      push: false
      image-name: ${{ github.repository }}
    secrets:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
