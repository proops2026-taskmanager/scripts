name: IaC CD

# Auto-applies DEV Terraform when the terraform repo changes are reflected here.
# Triggered via workflow_dispatch (manual) or repository_dispatch (from terraform.git push hook).
# Staging and PROD use iac-manual.yml (explicit human approval required).
#
# Required org secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   GHCR_PAT  (classic PAT with repo + write:packages scopes — used for cross-repo checkout)
#   TF_VAR_users_db_password, TF_VAR_tasks_db_password, TF_VAR_notifications_db_password

on:
  workflow_dispatch:
  repository_dispatch:
    types: [terraform-dev-apply]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Terraform repo
        uses: actions/checkout@v4
        with:
          repository: proops2026-taskmanager/terraform
          token: ${{ secrets.GHCR_PAT }}

      - name: Run Terraform apply
        uses: chau11ece/proops2026-cicd-platform/.github/actions/tf-action@v1
        with:
          action: apply
          working-directory: environments/dev
          aws-region: eu-central-1
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        env:
          TF_VAR_users_db_password:         ${{ secrets.TF_VAR_USERS_DB_PASSWORD }}
          TF_VAR_tasks_db_password:         ${{ secrets.TF_VAR_TASKS_DB_PASSWORD }}
          TF_VAR_notifications_db_password: ${{ secrets.TF_VAR_NOTIFICATIONS_DB_PASSWORD }}
