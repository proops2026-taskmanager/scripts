name: IaC CD

# Runs only when Terraform files under ci/** are merged to main.
# Purpose: terraform apply — provisions or updates DEV infrastructure.
# Staging and PROD infrastructure changes go through iac-manual.yml (manual review required).

on:
  push:
    branches: [main]
    paths:
      - 'ci/**'

permissions:
  contents: read

jobs:
  apply:
    uses: chau11ece/proops2026-cicd-platform/.github/workflows/reusable-iac.yml@v1
    with:
      action: apply
      environment: dev
      working-directory: ci/terraform/environments/dev
    secrets:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
