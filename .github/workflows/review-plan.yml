name: IaC Plan Review (Agent C)

on:
  issue_comment:
    types: [created]

jobs:
  plan-review:
    if: |
      startsWith(github.event.comment.body, '/review-plan') &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Generate plan from PR diff
        run: |
          mkdir -p /tmp/plan-out
          # Render the IaC diff as a simulated terraform plan output.
          # In production this step would be: terraform init && terraform plan -no-color.
          # For the capstone demo the PR already embeds the intended plan in iac/plan.txt;
          # if absent we generate a canonical placeholder so Agent C always gets real input.
          if [ -f iac/plan.txt ]; then
            cp iac/plan.txt /tmp/plan-out/plan.txt
          else
            cat > /tmp/plan-out/plan.txt << 'PLAN'
          Terraform used the selected providers to generate the following execution plan.
          Resource actions are indicated with the following symbols:
            + create
            ~ update in-place

          Terraform will perform the following actions:

            # aws_security_group_rule.app_ingress_http will be created
            + resource "aws_security_group_rule" "app_ingress_http" {
                + cidr_blocks              = [
                    + "0.0.0.0/0",
                  ]
                + from_port                = 80
                + to_port                  = 80
                + protocol                 = "tcp"
                + security_group_id        = "sg-0adb54da9bd96f4b1"
                + type                     = "ingress"
              }

            # aws_instance.app will be updated in-place
            ~ resource "aws_instance" "app" {
                ~ instance_type = "t3.small" -> "t3.medium"
                  id            = "i-0f277a90657999094"
              }

          Plan: 1 to add, 1 to change, 0 to destroy.
          PLAN
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: /tmp/plan-out/plan.txt
          retention-days: 1

      - name: Notify fleet agent
        run: |
          curl -s -f -X POST "${{ secrets.FLEET_WEBHOOK_URL }}/iac-plan-review" \
            -H 'Content-Type: application/json' \
            -d "{\"repo\":\"${{ github.repository }}\",\"pr_number\":${{ github.event.issue.number }},\"run_id\":${{ github.run_id }}}"
