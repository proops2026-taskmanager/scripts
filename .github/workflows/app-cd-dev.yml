name: Full-stack smoke — DEV

# Manual trigger: run after any service deploys to DEV to verify the full stack.
# Tests the complete user flow through api-gateway ELB:
#   register → login → create task → list tasks
#
# Each service repo (notification-service, user-service, etc.) owns its own
# build → deploy pipeline. This workflow is the cross-service integration check.
#
# Required GitHub repo settings:
#   Variables: DEV_BASE_URL = http://<api-gateway-elb-hostname>

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for ELB health
        env:
          BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${BASE_URL}/health" || echo "000")
            [ "$STATUS" = "200" ] && echo "DEV reachable" && break
            echo "Attempt ${i}/12 → ${STATUS}. Waiting 10s..."
            sleep 10
            [ "$i" = "12" ] && echo "DEV unreachable after 120s" && exit 1
          done

      - name: Run full-stack smoke test
        env:
          BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: bash e2e-tests/smoke/full-api.sh
