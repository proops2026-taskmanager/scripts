name: IaC CI — PR

# Runs only when Terraform files under ci/** are changed in a PR.
# Purpose: terraform plan — shows what infrastructure changes will be applied.
# Does NOT apply anything. Safe to run on every PR.

on:
  pull_request:
    paths:
      - 'ci/**'

permissions:
  contents: read

jobs:
  plan:
    uses: chau11ece/proops2026-cicd-platform/.github/workflows/reusable-iac.yml@v1
    with:
      action: plan
      environment: dev
      working-directory: ci/terraform/environments/dev
    secrets:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
