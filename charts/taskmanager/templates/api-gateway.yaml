apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gw-cm
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
    {{- include "taskmanager.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.apiGateway.port | quote }}
  USER_SERVICE_URL: "http://user-service:{{ .Values.userService.port }}"
  TASK_SERVICE_URL: "http://task-service:{{ .Values.taskService.port }}"
  NOTIFICATION_SERVICE_URL: {{ .Values.apiGateway.config.notificationServiceUrl | quote }}
  CORS_ORIGIN: {{ .Values.apiGateway.config.corsOrigin | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
    {{- include "taskmanager.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
    {{- include "taskmanager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: api-gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api-gateway
          image: {{ include "taskmanager.image" (dict "svc" .Values.apiGateway "global" .Values.global) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          envFrom:
            - configMapRef:
                name: api-gw-cm
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-gw-secret
                  key: JWT_SECRET
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
