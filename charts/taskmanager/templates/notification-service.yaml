# ── ConfigMap ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-svc-cm
  namespace: {{ .Release.Namespace }}
  labels:
    app: notification-service
    {{- include "taskmanager.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.notificationService.port | quote }}
---
# ── Service ───────────────────────────────────────────────────────────────────
# ClusterIP: reachable only inside the cluster.
# api-gateway routes /api/notifications → http://notification-service:3003
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: notification-service
    {{- include "taskmanager.labels" . | nindent 4 }}
spec:
  selector:
    app: notification-service
  ports:
    - port: {{ .Values.notificationService.port }}
      targetPort: {{ .Values.notificationService.port }}
---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: notification-service
    {{- include "taskmanager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.notificationService.replicas }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: notification-service
                topologyKey: kubernetes.io/hostname
      containers:
        - name: notification-service
          image: {{ include "taskmanager.image" (dict "svc" .Values.notificationService "global" .Values.global) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.notificationService.port }}
          envFrom:
            - configMapRef:
                name: notification-svc-cm
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secret
                  key: REDIS_URL
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: notification-svc-secret
                  key: DISCORD_WEBHOOK_URL
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.notificationService.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.notificationService.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
