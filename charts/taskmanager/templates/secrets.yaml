# ── user-service secret ───────────────────────────────────────────────────────
# b64enc: Helm base64-encodes the value before storing in K8s Secret.
# K8s stores Secrets as base64 internally — that is NOT encryption, just encoding.
# For real security: use Vault + External Secrets Operator, or AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: user-svc-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: user-service
    {{- include "taskmanager.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.userService.secret.databaseUrl | b64enc | quote }}
  JWT_SECRET: {{ .Values.userService.secret.jwtSecret | b64enc | quote }}
---
# ── task-service secret ───────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: task-svc-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: task-service
    {{- include "taskmanager.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.taskService.secret.databaseUrl | b64enc | quote }}
---
# ── api-gateway secret ────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: api-gw-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: api-gateway
    {{- include "taskmanager.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.apiGateway.secret.jwtSecret | b64enc | quote }}
---
# ── notification-service secret ───────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: notification-svc-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: notification-service
    {{- include "taskmanager.labels" . | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ .Values.notificationService.secret.databaseUrl | b64enc | quote }}
  REDIS_URL: {{ .Values.notificationService.secret.redisUrl | b64enc | quote }}
  DISCORD_WEBHOOK_URL: {{ .Values.notificationService.secret.discordWebhookUrl | b64enc | quote }}
